name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  GO_VERSION: '1.23'

jobs:
  # Build and Test Job
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Dependencies
        run: |
          go mod download
          go mod verify

      - name: Run Tests (if any exist)
        run: |
          if find . -name "*_test.go" -type f | grep -q .; then
            echo "Running tests..."
            go test -v -race -coverprofile=coverage.out ./...
            go tool cover -func=coverage.out
          else
            echo "No test files found, skipping tests"
          fi

      - name: Build Backend Binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o application ./cmd/api

      - name: Build Frontend Binary
        working-directory: web/energy-dashboard
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o energy-dashboard-go

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: application
          retention-days: 1

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-binary
          path: web/energy-dashboard/energy-dashboard-go
          retention-days: 1

  # Deploy Backend to Elastic Beanstalk
  deploy-backend:
    name: Deploy Backend to AWS EB
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    env:
      EB_APPLICATION_NAME: smart-energy-grid
      EB_ENVIRONMENT_NAME: smart-energy-grid-env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Credentials
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity
          echo "AWS Region: $AWS_REGION"

      - name: Install EB CLI
        run: |
          python3 -m pip install --upgrade --user awsebcli
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Verify EB CLI Installation
        run: |
          eb --version

      - name: Initialize EB Configuration
        run: |
          mkdir -p .elasticbeanstalk
          cat > .elasticbeanstalk/config.yml <<'EOFCONFIG'
          branch-defaults:
            main:
              environment: smart-energy-grid-env
          global:
            application_name: smart-energy-grid
            default_region: eu-north-1
            platform: Go 1 running on 64bit Amazon Linux 2023
            sc: git
            workspace_type: Application
          EOFCONFIG
          cat .elasticbeanstalk/config.yml

      - name: Ensure EB Application Exists
        run: |
          echo "Checking if EB application '$EB_APPLICATION_NAME' exists..."
          if aws elasticbeanstalk describe-applications \
              --application-names "$EB_APPLICATION_NAME" \
              --region "$AWS_REGION" 2>&1 | grep -q "ApplicationName"; then
            echo "✓ EB application '$EB_APPLICATION_NAME' exists"
          else
            echo "Creating EB application '$EB_APPLICATION_NAME'..."
            aws elasticbeanstalk create-application \
              --application-name "$EB_APPLICATION_NAME" \
              --description "Smart Energy Grid Management System Backend" \
              --region "$AWS_REGION"
            echo "✓ EB application created"
          fi

      - name: Initialize EB
        run: |
          eb init "$EB_APPLICATION_NAME" \
            --platform "Go 1 running on 64bit Amazon Linux 2023" \
            --region "$AWS_REGION"

      - name: Check Environment Status
        run: |
          echo "Checking environment '$EB_ENVIRONMENT_NAME' status..."
          if aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --region "$AWS_REGION" 2>&1 | grep -q "EnvironmentName"; then
            STATUS=$(aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --region "$AWS_REGION" \
              --query 'Environments[0].Status' \
              --output text)
            echo "Environment exists with status: $STATUS"
            if [ "$STATUS" = "Terminated" ]; then
              echo "Environment is terminated, will need to recreate"
              echo "ENV_EXISTS=false" >> $GITHUB_ENV
            else
              echo "ENV_EXISTS=true" >> $GITHUB_ENV
            fi
          else
            echo "Environment does not exist"
            echo "ENV_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create Environment if Needed
        if: env.ENV_EXISTS == 'false'
        run: |
          echo "Creating new environment '$EB_ENVIRONMENT_NAME'..."
          eb create "$EB_ENVIRONMENT_NAME" \
            --single \
            --instance_type t3.micro \
            --region "$AWS_REGION" \
            --timeout 20 || echo "Environment might already exist, continuing..."

      - name: Use Environment
        run: |
          eb use "$EB_ENVIRONMENT_NAME"

      - name: Deploy to Elastic Beanstalk
        run: |
          echo "Deploying to environment '$EB_ENVIRONMENT_NAME'..."
          eb deploy "$EB_ENVIRONMENT_NAME" --timeout 20

      - name: Get Backend URL
        run: |
          echo "✓ Backend deployed successfully!"
          eb status "$EB_ENVIRONMENT_NAME" | grep CNAME || echo "URL will be available shortly"

  # Deploy Frontend to Elastic Beanstalk
  deploy-frontend:
    name: Deploy Frontend to AWS EB
    runs-on: ubuntu-latest
    needs: [test, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    env:
      EB_APP_NAME: energy-dashboard-frontend
      EB_ENV_NAME: energy-dashboard-frontend-env
      BACKEND_API_URL: http://smart-energy-grid-env.eba-kpbmbqps.eu-north-1.elasticbeanstalk.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Credentials
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity

      - name: Install EB CLI
        run: |
          python3 -m pip install --upgrade --user awsebcli
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Initialize EB Configuration
        working-directory: web/energy-dashboard
        run: |
          mkdir -p .elasticbeanstalk
          cat > .elasticbeanstalk/config.yml <<'EOFCONFIG'
          branch-defaults:
            main:
              environment: energy-dashboard-frontend-env
          global:
            application_name: energy-dashboard-frontend
            default_region: eu-north-1
            platform: Go 1 running on 64bit Amazon Linux 2023
            sc: git
            workspace_type: Application
          EOFCONFIG

      - name: Ensure Frontend Application Exists
        run: |
          echo "Checking if EB application '$EB_APP_NAME' exists..."
          if aws elasticbeanstalk describe-applications \
              --application-names "$EB_APP_NAME" \
              --region "$AWS_REGION" 2>&1 | grep -q "ApplicationName"; then
            echo "✓ EB application exists"
          else
            echo "Creating EB application..."
            aws elasticbeanstalk create-application \
              --application-name "$EB_APP_NAME" \
              --description "Smart Energy Grid Dashboard Frontend" \
              --region "$AWS_REGION"
          fi

      - name: Initialize Frontend EB
        working-directory: web/energy-dashboard
        run: |
          eb init "$EB_APP_NAME" \
            --platform "Go 1 running on 64bit Amazon Linux 2023" \
            --region "$AWS_REGION"

      - name: Check Frontend Environment Status
        run: |
          if aws elasticbeanstalk describe-environments \
              --application-name "$EB_APP_NAME" \
              --environment-names "$EB_ENV_NAME" \
              --region "$AWS_REGION" 2>&1 | grep -q "EnvironmentName"; then
            STATUS=$(aws elasticbeanstalk describe-environments \
              --application-name "$EB_APP_NAME" \
              --environment-names "$EB_ENV_NAME" \
              --region "$AWS_REGION" \
              --query 'Environments[0].Status' \
              --output text)
            echo "Environment exists with status: $STATUS"
            if [ "$STATUS" = "Terminated" ]; then
              echo "FRONTEND_ENV_EXISTS=false" >> $GITHUB_ENV
            else
              echo "FRONTEND_ENV_EXISTS=true" >> $GITHUB_ENV
            fi
          else
            echo "FRONTEND_ENV_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create Frontend Environment if Needed
        if: env.FRONTEND_ENV_EXISTS == 'false'
        working-directory: web/energy-dashboard
        run: |
          eb create "$EB_ENV_NAME" \
            --single \
            --instance_type t3.micro \
            --region "$AWS_REGION" \
            --timeout 20 \
            --envvars API_URL="$BACKEND_API_URL",PORT=3000 || echo "Continuing..."

      - name: Use Frontend Environment
        working-directory: web/energy-dashboard
        run: |
          eb use "$EB_ENV_NAME"

      - name: Set Environment Variables
        working-directory: web/energy-dashboard
        run: |
          eb setenv API_URL="$BACKEND_API_URL" PORT=3000 || echo "Variables might already be set"

      - name: Deploy Frontend
        working-directory: web/energy-dashboard
        run: |
          echo "Deploying frontend..."
          eb deploy "$EB_ENV_NAME" --timeout 20

      - name: Get Frontend URL
        working-directory: web/energy-dashboard
        run: |
          echo "✓ Frontend deployed successfully!"
          eb status "$EB_ENV_NAME" | grep CNAME || echo "URL will be available shortly"

  # Deploy Lambda Functions
  deploy-lambda:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    strategy:
      matrix:
        function: [analytics-processing, anomaly-detection]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Lambda Function
        working-directory: lambda-functions/${{ matrix.function }}
        run: |
          echo "Building Lambda function: ${{ matrix.function }}"
          go mod download
          go mod verify
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags lambda.norpc -o bootstrap main.go
          zip function.zip bootstrap
          ls -lh function.zip

      - name: Deploy to Lambda
        working-directory: lambda-functions/${{ matrix.function }}
        run: |
          FUNCTION_NAME="${{ matrix.function }}"
          
          echo "Checking if Lambda function '$FUNCTION_NAME' exists..."
          if aws lambda get-function \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION" 2>&1 | grep -q "FunctionName"; then
            echo "✓ Function exists, updating code..."
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://function.zip \
              --region "$AWS_REGION"
            echo "✓ Function updated successfully"
          else
            echo "⚠ Function '$FUNCTION_NAME' does not exist"
            echo "Please create the Lambda function manually first, or add creation logic"
            exit 0
          fi

      - name: Clean up
        working-directory: lambda-functions/${{ matrix.function }}
        if: always()
        run: rm -f bootstrap function.zip
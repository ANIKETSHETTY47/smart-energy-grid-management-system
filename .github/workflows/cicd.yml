name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  GO_VERSION: '1.23'

jobs:
  # Build and Test Job
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Dependencies
        run: |
          go mod download
          go mod verify

      - name: Run Tests (if any exist)
        run: |
          if find . -name "*_test.go" -type f | grep -q .; then
            echo "Running tests..."
            go test -v -race -coverprofile=coverage.out ./...
            go tool cover -func=coverage.out
          else
            echo "No test files found, skipping tests"
          fi

      - name: Build Backend Binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o application ./cmd/api

      - name: Build Frontend Binary
        working-directory: web/energy-dashboard
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o energy-dashboard-go

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: application
          retention-days: 1

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-binary
          path: web/energy-dashboard/energy-dashboard-go
          retention-days: 1

  # Deploy Backend to Elastic Beanstalk
  deploy-backend:
    name: Deploy Backend to AWS EB
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    env:
      EB_APPLICATION_NAME: smart-energy-grid
      EB_ENVIRONMENT_NAME: smart-energy-grid-env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Credentials
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity

      - name: Install EB CLI
        run: |
          python3 -m pip install --upgrade --user awsebcli
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Initialize EB Configuration
        run: |
          mkdir -p .elasticbeanstalk
          cat > .elasticbeanstalk/config.yml <<'EOFCONFIG'
          branch-defaults:
            main:
              environment: smart-energy-grid-env
          global:
            application_name: smart-energy-grid
            default_region: eu-north-1
            platform: Go 1 running on 64bit Amazon Linux 2023
            sc: git
            workspace_type: Application
          EOFCONFIG

      - name: Ensure EB Application Exists
        run: |
          echo "Checking if EB application exists..."
          if aws elasticbeanstalk describe-applications \
              --application-names "$EB_APPLICATION_NAME" \
              --region "$AWS_REGION" 2>&1 | grep -q "Application.*already exists"; then
            echo "Application already exists, skipping creation"
          elif aws elasticbeanstalk describe-applications \
              --application-names "$EB_APPLICATION_NAME" \
              --region "$AWS_REGION" 2>&1 | grep -q "ApplicationName"; then
            echo "Application exists"
          else
            echo "Creating application..."
            aws elasticbeanstalk create-application \
              --application-name "$EB_APPLICATION_NAME" \
              --description "Smart Energy Grid Management System Backend" \
              --region "$AWS_REGION" || echo "Creation failed or already exists, continuing..."
          fi

      - name: Initialize EB
        run: |
          eb init "$EB_APPLICATION_NAME" \
            --platform "Go 1 running on 64bit Amazon Linux 2023" \
            --region "$AWS_REGION" || echo "Already initialized"

      - name: Use Environment
        run: |
          eb use "$EB_ENVIRONMENT_NAME" || echo "Environment selection handled by config"

      - name: Deploy to Elastic Beanstalk
        run: |
          echo "Deploying to EB..."
          eb deploy "$EB_ENVIRONMENT_NAME" --timeout 20 || echo "Deployment may need manual intervention"

      - name: Get Backend URL
        run: |
          eb status "$EB_ENVIRONMENT_NAME" | grep CNAME || echo "Check EB console for URL"

  # Deploy Frontend to Elastic Beanstalk
  deploy-frontend:
    name: Deploy Frontend to AWS EB
    runs-on: ubuntu-latest
    needs: [test, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    env:
      EB_APP_NAME: energy-dashboard-frontend
      EB_ENV_NAME: energy-dashboard-frontend-env
      BACKEND_API_URL: http://smart-energy-grid-env.eba-kpbmbqps.eu-north-1.elasticbeanstalk.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install EB CLI
        run: |
          python3 -m pip install --upgrade --user awsebcli
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Initialize EB Configuration
        working-directory: web/energy-dashboard
        run: |
          mkdir -p .elasticbeanstalk
          cat > .elasticbeanstalk/config.yml <<'EOFCONFIG'
          branch-defaults:
            main:
              environment: energy-dashboard-frontend-env
          global:
            application_name: energy-dashboard-frontend
            default_region: eu-north-1
            platform: Go 1 running on 64bit Amazon Linux 2023
            sc: git
            workspace_type: Application
          EOFCONFIG

      - name: Ensure Frontend Application Exists
        run: |
          if aws elasticbeanstalk describe-applications \
              --application-names "$EB_APP_NAME" \
              --region "$AWS_REGION" 2>&1 | grep -q "already exists"; then
            echo "Application already exists, skipping"
          elif aws elasticbeanstalk describe-applications \
              --application-names "$EB_APP_NAME" \
              --region "$AWS_REGION" 2>&1 | grep -q "ApplicationName"; then
            echo "Application exists"
          else
            aws elasticbeanstalk create-application \
              --application-name "$EB_APP_NAME" \
              --description "Smart Energy Grid Dashboard Frontend" \
              --region "$AWS_REGION" || echo "Skipping..."
          fi

      - name: Initialize Frontend EB
        working-directory: web/energy-dashboard
        run: |
          eb init "$EB_APP_NAME" \
            --platform "Go 1 running on 64bit Amazon Linux 2023" \
            --region "$AWS_REGION" || echo "Already initialized"

      - name: Use Frontend Environment
        working-directory: web/energy-dashboard
        run: |
          eb use "$EB_ENV_NAME" || echo "Environment handled by config"

      - name: Deploy Frontend
        working-directory: web/energy-dashboard
        run: |
          eb deploy "$EB_ENV_NAME" --timeout 20 || echo "Deployment may need manual intervention"

      - name: Get Frontend URL
        working-directory: web/energy-dashboard
        run: |
          eb status "$EB_ENV_NAME" | grep CNAME || echo "Check EB console"

  # Deploy Lambda Functions
  deploy-lambda:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    strategy:
      matrix:
        function: [analytics-processing, anomaly-detection]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Lambda Function
        working-directory: lambda-functions/${{ matrix.function }}
        run: |
          echo "Building Lambda: ${{ matrix.function }}"
          go mod download
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags lambda.norpc -o bootstrap main.go
          zip function.zip bootstrap

      - name: Deploy to Lambda
        working-directory: lambda-functions/${{ matrix.function }}
        run: |
          FUNCTION_NAME="${{ matrix.function }}"
          
          echo "Attempting to update Lambda function: $FUNCTION_NAME"
          if aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://function.zip \
              --region "$AWS_REGION" 2>&1; then
            echo "✓ Function updated successfully"
          else
            echo "⚠ Update failed - function may not exist or insufficient permissions"
            echo "Skipping Lambda deployment for $FUNCTION_NAME"
          fi

      - name: Clean up
        working-directory: lambda-functions/${{ matrix.function }}
        if: always()
        run: rm -f bootstrap function.zip

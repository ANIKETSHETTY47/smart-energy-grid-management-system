name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  GO_VERSION: '1.22'

jobs:
  # Build and Test Job
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Dependencies
        run: |
          go mod download
          go mod verify

      - name: Run Tests
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Build Backend Binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o application ./cmd/api

      - name: Build Frontend Binary
        working-directory: web/energy-dashboard
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o energy-dashboard-go

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: application
          retention-days: 1

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-binary
          path: web/energy-dashboard/energy-dashboard-go
          retention-days: 1

  # Deploy Backend to Elastic Beanstalk
  deploy-backend:
    name: Deploy Backend to AWS EB
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    env:
      EB_APPLICATION_NAME: smart-energy-grid
      EB_ENVIRONMENT_NAME: smart-energy-grid-env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install EB CLI
        run: |
          python3 -m pip install --upgrade --user awsebcli
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Initialize EB Configuration
        run: |
          mkdir -p .elasticbeanstalk
          cat > .elasticbeanstalk/config.yml << 'EOF'
          branch-defaults:
            main:
              environment: ${{ env.EB_ENVIRONMENT_NAME }}
          global:
            application_name: ${{ env.EB_APPLICATION_NAME }}
            default_region: ${{ env.AWS_REGION }}
            platform: Go 1 running on 64bit Amazon Linux 2023
            sc: git
            workspace_type: Application
          EOF

      - name: Ensure EB Application Exists
        run: |
          if ! aws elasticbeanstalk describe-applications \
              --application-names "${{ env.EB_APPLICATION_NAME }}" \
              --query 'Applications[0].ApplicationName' \
              --output text 2>/dev/null | grep -q "${{ env.EB_APPLICATION_NAME }}"; then
            echo "Creating EB application..."
            aws elasticbeanstalk create-application \
              --application-name "${{ env.EB_APPLICATION_NAME }}" \
              --description "Smart Energy Grid Management System Backend"
          else
            echo "EB application already exists"
          fi

      - name: Initialize EB
        run: |
          eb init "${{ env.EB_APPLICATION_NAME }}" \
            --platform "Go 1 running on 64bit Amazon Linux 2023" \
            --region "${{ env.AWS_REGION }}"

      - name: Create or Use Environment
        run: |
          if ! aws elasticbeanstalk describe-environments \
              --application-name "${{ env.EB_APPLICATION_NAME }}" \
              --environment-names "${{ env.EB_ENVIRONMENT_NAME }}" \
              --query 'Environments[?Status!=`Terminated`]' \
              --output text 2>/dev/null | grep -q .; then
            echo "Creating new environment..."
            eb create "${{ env.EB_ENVIRONMENT_NAME }}" \
              --single \
              --instance_type t3.micro \
              --service-role aws-elasticbeanstalk-service-role \
              --instance_profile aws-elasticbeanstalk-ec2-role \
              --timeout 20
          else
            echo "Environment exists, will deploy to it"
          fi
          eb use "${{ env.EB_ENVIRONMENT_NAME }}"

      - name: Deploy to Elastic Beanstalk
        run: |
          echo "Deploying backend to EB..."
          eb deploy "${{ env.EB_ENVIRONMENT_NAME }}" --timeout 20

      - name: Get Backend URL
        run: |
          echo "Backend deployed successfully!"
          eb status "${{ env.EB_ENVIRONMENT_NAME }}" | awk '/CNAME/ {print "Backend URL: http://"$2}'

  # Deploy Frontend to Elastic Beanstalk
  deploy-frontend:
    name: Deploy Frontend to AWS EB
    runs-on: ubuntu-latest
    needs: [test, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    env:
      EB_APP_NAME: energy-dashboard-frontend
      EB_ENV_NAME: energy-dashboard-frontend-env
      BACKEND_API_URL: http://smart-energy-grid-env.us-east-1.elasticbeanstalk.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install EB CLI
        run: |
          python3 -m pip install --upgrade --user awsebcli
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Initialize EB Configuration
        working-directory: web/energy-dashboard
        run: |
          mkdir -p .elasticbeanstalk
          cat > .elasticbeanstalk/config.yml << 'EOF'
          branch-defaults:
            main:
              environment: ${{ env.EB_ENV_NAME }}
          global:
            application_name: ${{ env.EB_APP_NAME }}
            default_region: ${{ env.AWS_REGION }}
            platform: Go 1 running on 64bit Amazon Linux 2023
            sc: git
            workspace_type: Application
          EOF

      - name: Ensure Frontend Application Exists
        run: |
          if ! aws elasticbeanstalk describe-applications \
              --application-names "${{ env.EB_APP_NAME }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'Applications[0].ApplicationName' \
              --output text 2>/dev/null | grep -q "${{ env.EB_APP_NAME }}"; then
            echo "Creating frontend application..."
            aws elasticbeanstalk create-application \
              --application-name "${{ env.EB_APP_NAME }}" \
              --description "Smart Energy Grid Dashboard Frontend" \
              --region "${{ env.AWS_REGION }}"
          else
            echo "Frontend application already exists"
          fi

      - name: Initialize Frontend EB
        working-directory: web/energy-dashboard
        run: |
          eb init "${{ env.EB_APP_NAME }}" \
            --platform "Go 1 running on 64bit Amazon Linux 2023" \
            --region "${{ env.AWS_REGION }}"

      - name: Create or Use Frontend Environment
        working-directory: web/energy-dashboard
        run: |
          if ! aws elasticbeanstalk describe-environments \
              --application-name "${{ env.EB_APP_NAME }}" \
              --environment-names "${{ env.EB_ENV_NAME }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'Environments[?Status!=`Terminated`]' \
              --output text 2>/dev/null | grep -q .; then
            echo "Creating frontend environment..."
            eb create "${{ env.EB_ENV_NAME }}" \
              --region "${{ env.AWS_REGION }}" \
              --single \
              --instance-type t3.micro \
              --timeout 20 \
              --service-role aws-elasticbeanstalk-service-role \
              --instance_profile aws-elasticbeanstalk-ec2-role \
              --envvars API_URL="${{ env.BACKEND_API_URL }}",PORT=3000
          else
            echo "Frontend environment exists"
          fi
          eb use "${{ env.EB_ENV_NAME }}"

      - name: Set Environment Variables
        working-directory: web/energy-dashboard
        run: |
          eb setenv \
            API_URL="${{ env.BACKEND_API_URL }}" \
            PORT=3000

      - name: Deploy Frontend
        working-directory: web/energy-dashboard
        run: |
          echo "Deploying frontend to EB..."
          eb deploy "${{ env.EB_ENV_NAME }}" --timeout 20

      - name: Get Frontend URL
        working-directory: web/energy-dashboard
        run: |
          echo "Frontend deployed successfully!"
          eb status "${{ env.EB_ENV_NAME }}" | awk '/CNAME/ {print "Frontend URL: http://"$2}'

  # Deploy Lambda Functions (Optional - only if needed)
  deploy-lambda:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    strategy:
      matrix:
        function: [analytics-processing, anomaly-detection]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Lambda Function
        working-directory: lambda-functions/${{ matrix.function }}
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bootstrap main.go
          zip function.zip bootstrap

      - name: Deploy to Lambda
        working-directory: lambda-functions/${{ matrix.function }}
        run: |
          FUNCTION_NAME="${{ matrix.function }}"
          
          # Check if function exists
          if aws lambda get-function --function-name "$FUNCTION_NAME" 2>/dev/null; then
            echo "Updating existing function..."
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://function.zip
          else
            echo "Function doesn't exist. Please create it manually first or use SAM/Terraform."
          fi

      - name: Clean up
        working-directory: lambda-functions/${{ matrix.function }}
        run: rm -f bootstrap function.zip
